server:

  port: 8080



spring:

  application:

    name: api-gateway

  cloud:

    gateway:

      routes:

        - id: auth-service

          uri: ${AUTH_SERVICE_URL:http://localhost:8081}

          predicates:

            - Path=/api/auth/**

        - id: tracking-service

          uri: ${TRACKING_SERVICE_URL:http://localhost:8082}

          predicates:

            - Path=/api/tracking/**



app:

  cors:

    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost}



management:

  endpoints:

    web:

      exposure:

        include: health

