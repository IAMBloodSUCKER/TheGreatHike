<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" fill="none" role="img" aria-label="TheGreatHike — трекер походов с юмором и статистикой">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="200">
      <stop offset="0%" stop-color="#2a3544"/>
      <stop offset="100%" stop-color="#1c2430"/>
    </linearGradient>
    <linearGradient id="coil" x1="60" y1="20" x2="180" y2="180">
      <stop offset="0%" stop-color="#f2dcc0"/>
      <stop offset="45%" stop-color="#d4a066"/>
      <stop offset="100%" stop-color="#8b5a2b"/>
    </linearGradient>
    <linearGradient id="coil-shine" x1="70" y1="40" x2="120" y2="120">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e8a838"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="200" rx="24" fill="url(#bg)"/>

  <g transform="translate(28, 18) scale(0.62)" filter="url(#shadow)">
    <path d="M72 118c0-2 8-28 28-36s36-4 36-4 22 2 36 10 28 30 28 42c0 18-16 34-40 40s-52 0-68-14c-12-11-20-28-20-38z" fill="url(#coil)"/>
    <path d="M84 88c0-2 6-22 22-28s28-2 28-2 16 2 26 8 20 22 20 32c0 14-12 26-30 30s-38 0-50-12c-8-8-16-20-16-28z" fill="url(#coil)"/>
    <path d="M98 62c0-2 4-16 16-20s20-2 20-2 12 2 18 6 14 16 14 24c0 10-8 18-20 20s-26 0-34-8c-6-6-14-14-14-20z" fill="url(#coil)"/>
    <path d="M118 34c4-8 12-14 22-14s18 6 22 14c2 4 2 8 0 12-4 8-12 12-22 12s-18-4-22-12c-2-4-2-8 0-12z" fill="url(#coil)"/>
    <path d="M88 78c18-10 42-12 64-4 20 7 34 24 36 42" stroke="url(#coil-shine)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.55"/>

    <circle cx="92" cy="118" r="9" fill="#e8a838" opacity="0.35"/>
    <circle cx="164" cy="118" r="9" fill="#e8a838" opacity="0.35"/>
    <ellipse cx="108" cy="108" rx="11" ry="14" fill="#2a1608"/>
    <ellipse cx="148" cy="108" rx="11" ry="14" fill="#2a1608"/>
    <circle cx="111" cy="103" r="4" fill="#fff" opacity="0.95"/>
    <circle cx="151" cy="103" r="4" fill="#fff" opacity="0.95"/>
    <path d="M112 128 Q128 146 144 128" stroke="#2a1608" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="128" cy="136" rx="9" ry="5.5" fill="#d4738a" opacity="0.9"/>

    <g transform="translate(168 78)">
      <circle r="16" fill="url(#badge)"/>
      <path d="M-8 4 L0 -8 L8 4 Z" fill="#7a4f28" opacity="0.85"/>
      <path d="M-3 4 L3 -2 L9 4 Z" fill="#7a4f28" opacity="0.65"/>
    </g>
  </g>

  <text x="200" y="92" font-family="Manrope, Segoe UI, system-ui, sans-serif" font-size="56" font-weight="800" fill="#f4f1ec">
    The<tspan fill="#e8a838">Great</tspan>Hike
  </text>
  <text x="202" y="128" font-family="Manrope, Segoe UI, system-ui, sans-serif" font-size="18" fill="#9aa8b8">
    трекер походов с юмором и статистикой
  </text>
</svg>
